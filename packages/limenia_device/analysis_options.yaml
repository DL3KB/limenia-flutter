include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures
    - avoid_dynamic_calls

formatter:
  page_width: 120
